<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Dev Quiz App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="quiz-container">

    <!-- Start screen -->
    <section id="start-screen" class="screen active">
      <h1>🧠 Web Dev Quiz</h1>
      <p>Test your knowledge of HTML, CSS and JavaScript.</p>
      <ul class="rules">
        <li>8 questions</li>
        <li>15 seconds per question</li>
        <li>1 point for each correct answer</li>
      </ul>
      <button id="start-btn" class="btn">Start Quiz</button>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="screen">
      <div class="top-bar">
        <span id="question-count">Question 1 / 8</span>
        <span id="timer">⏱ 15</span>
      </div>
      <div class="progress">
        <div id="progress-bar"></div>
      </div>
      <h2 id="question-text"></h2>
      <div id="options"></div>
      <button id="next-btn" class="btn" disabled>Next</button>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen">
      <h1>Quiz Complete 🎉</h1>
      <p class="score-label">Your score</p>
      <p id="score" class="score">0 / 8</p>
      <p id="message"></p>
      <button id="restart-btn" class="btn">Restart Quiz</button>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
